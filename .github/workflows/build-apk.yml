name: Build LifeLink APK
# Test build: Actions -> Build LifeLink APK -> Run workflow. Needs no secrets. Gives you a debug APK to install.
# Release build: push a tag like v2.5.1. It also makes a SIGNED APK, but only if the 4 ANDROID_* secrets exist in the repo settings.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install dependencies
        run: npm install
      - name: Prepare web files
        run: npm run prepare:www
      - name: Create Android project
        run: npx cap add android
      - name: Apply LifeLink Android settings
        run: node scripts/android-setup.js
      - name: Sync web files into the app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lifelink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build release APK (unsigned)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign release APK
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | tr -d '\r ' | grep -v -- '-----' | base64 -d > "$RUNNER_TEMP/lifelink-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lifelink-release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out LifeLink.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs LifeLink.apk
          rm -f "$RUNNER_TEMP/lifelink-release.jks"
      - name: Upload signed APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-apk
          path: |
            LifeLink.apk
            version.json
